name: boibritto_android
description: "Boibritto — peer-to-peer book lending for students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^18.0.1

  # State management
  flutter_riverpod: ^3.4.3

  # Networking
  dio: ^5.11.1

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local persistence
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^11.2.0

  # Connectivity + images
  connectivity_plus: ^7.3.1
  cached_network_image: ^4.0.2

  # Firebase (Auth, FCM, Firestore messages) — see SETUP.md
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  drift_dev: ^2.24.0

flutter:
  uses-material-design: true
